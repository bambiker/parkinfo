# אוסף כל חצי שעה את הסטטוס של חניוני אחוזות החוף (פנוי / מעט / מלא / סגור)
# ושומר אותו בענף occupancy-data, כדי לבנות בהמשך סטטיסטיקות של תפוסה.
# הנתונים בענף נפרד, כדי שכל איסוף לא יפרסם מחדש את האתר.
name: איסוף תפוסת חניונים

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-occupancy
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: פתיחת ענף הנתונים
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin occupancy-data; then
            git worktree add -B occupancy-data data FETCH_HEAD
          else
            git worktree add --detach data
            cd data
            git checkout --orphan occupancy-data
            git rm -rfq .
          fi
      - name: איסוף
        run: node scripts/collect-occupancy.js data
      - name: שמירה
        working-directory: data
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "אין נתונים חדשים"
            exit 0
          fi
          git commit -qm "תפוסת חניונים $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push origin occupancy-data && exit 0
            sleep 5
            git pull --rebase -q origin occupancy-data || true
          done
          exit 1
